# Unified build for Linux, macOS, and Windows
name: SonoBus — Build (matrix)

on:
  push:
  # pull_request:

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libfreetype-dev libasound2-dev libjack-jackd2-dev

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -DJUCE_ENABLE_STANDALONE_APPLICATION:BOOL=ON -DJUCE_ASIO:BOOL=ON

      - name: Configure CMake (Linux & macOS)
        if: runner.os != 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --config Release --target SonoBusMendeni_Standalone
          cmake --build build --config Release --target SonoBusMendeni_VST3

      - name: Stage TouchOSC
        run: |
           cp util/SonoBusMendeni.tosc build/SonoBusMendeni_artefacts/Release

      - name: Stage VST3 Install Script (macOS)
        if: runner.os == 'macOS'
        run: |
           cp util/install-macos-vst3.sh build/SonoBusMendeni_artefacts/Release

      - name: Upload Sonobus artifacts (Windows & Linux)
        if: runner.os != 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: SonoBusMendeni-${{ matrix.os }}
          path: |
            build/SonoBusMendeni_artefacts/Release/Standalone
            build/SonoBusMendeni_artefacts/Release/VST3
            build/SonoBusMendeni_artefacts/Release/SonoBusMendeni.tosc

      - name: Upload Sonobus artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: SonoBusMendeni-${{ matrix.os }}
          path: |
            build/SonoBusMendeni_artefacts/Release/Standalone
            build/SonoBusMendeni_artefacts/Release/VST3
            build/SonoBusMendeni_artefacts/Release/install-macos-vst3.sh
            build/SonoBusMendeni_artefacts/Release/SonoBusMendeni.tosc

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager --install "platforms;android-33"
          sdkmanager --install "ndk;25.2.9519653"
          sdkmanager --install "cmake;3.22.1"

      - name: Build release APK
        working-directory: mobile/Builds/Android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease_Release --no-daemon --warning-mode all

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: SonoBusMendeni-Android
          path: mobile/Builds/Android/app/build/outputs/apk/**/*.apk
