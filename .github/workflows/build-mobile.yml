# build for Android
name: SonoBus — Build Android

on:
  push:
    branches:
      - 1.7.*

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager --install "platforms;android-33"
          sdkmanager --install "ndk;25.2.9519653"
          sdkmanager --install "cmake;3.22.1"

      - name: Build release APK
        working-directory: mobile/Builds/Android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease_Release --no-daemon --warning-mode all

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: SonoBusMendeni-latest
          path: mobile/Builds/Android/app/build/outputs/apk/**/*.apk
